name: Lifecycle

"on":
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: >
    ${{ github.workflow }}-
    ${{ github.event_name }}-
    ${{ github.event.inputs.ref || github.ref }}
  # never cancel runs on main, they might be creating a release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: release-please
        name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # release-please bumps gradle.properties, the npm package, the plugin manifests and server.json follow it
      - name: Checkout release pull request
        if: steps.release-please.outputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(steps.release-please.outputs.pr).headBranchName }}
      - name: Sync versions
        if: steps.release-please.outputs.pr
        run: |
          node scripts/sync-version.mjs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync plugin and npm package versions"
            git push
          fi

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # HMC-Specifics' API is not published, it is built from the submodule
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Rename jars
        run: |
          mkdir dist
          cp build/headlessmc-mcp-*-runner.jar dist/headlessmc-mcp.jar
          cp hmc-mcp-bridge/build/libs/hmc-mcp-bridge-*.jar dist/

      - name: Upload jars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headlessmc-mcp-jar
          path: dist/*
          if-no-files-found: error

  build-natives:
    runs-on: ${{ matrix.os.os }}
    needs: release-please
    # release-please is skipped on pull requests, run anyway
    if: ${{ !cancelled() && needs.release-please.result != 'failure' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - { os: ubuntu-latest, name: headlessmc-mcp-linux-x64 }
        # native builds on the other platforms take long, so only build them for releases, like HeadlessMc
        include: >-
          ${{ fromJSON(needs.release-please.outputs.release_created == 'true' && '[
            {"os":{"os":"ubuntu-24.04-arm","name":"headlessmc-mcp-linux-arm64"}},
            {"os":{"os":"windows-latest","name":"headlessmc-mcp-windows-x64"}},
            {"os":{"os":"macos-latest","name":"headlessmc-mcp-macos-arm64"}},
            {"os":{"os":"macos-15-intel","name":"headlessmc-mcp-macos-x64"}}
          ]' || '[]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Build native executable
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sudo sysctl -w kern.maxfiles=524288
            sudo sysctl -w kern.maxfilesperproc=524288
            sudo launchctl limit maxfiles 524288 524288
            ulimit -n 524288
          fi
          bash scripts/build-native.sh

      - name: Rename executable
        shell: bash
        run: |
          mkdir dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mv build/headlessmc-mcp-*-runner.exe "dist/${{ matrix.os.name }}.exe"
          else
            mv build/headlessmc-mcp-*-runner "dist/${{ matrix.os.name }}"
            chmod +x "dist/${{ matrix.os.name }}"
          fi

      # stdout is the MCP channel, the server has to answer an initialize request on it
      - name: Smoke test executable
        shell: bash
        run: |
          EXE="dist/${{ matrix.os.name }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then EXE="$EXE.exe"; fi
          REQUEST='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          RESPONSE=$( (echo "$REQUEST"; sleep 10) | "$EXE" "-Dhmc.files.location=$RUNNER_TEMP/hmc" | head -n 1)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"serverInfo"'

      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.os.name }}
          path: dist/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [release-please, build, build-natives]
    if: needs.release-please.outputs.release_created == 'true'
    # environments show up as deployments in the repository sidebar
    environment:
      name: github-releases
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
    steps:
      - name: Download jars and executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Upload release assets
        # the release itself (tag and notes) has been created by release-please
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*

  # The plugins and server.json start the MCP server with npx, the npm packages contain the native executables
  publish-npm:
    runs-on: ubuntu-latest
    needs: [release-please, release]
    if: needs.release-please.outputs.release_created == 'true'
    environment:
      name: npm
      url: https://www.npmjs.com/package/@headlesshq/headlessmc-mcp
    permissions:
      contents: read
      # npm trusted publishing with provenance
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish npm packages
        run: |
          node scripts/npm-packages.mjs dist npm-out
          # the platform packages first, the main package depends on them
          for package in npm-out/headlessmc-mcp-*/ npm-out/headlessmc-mcp/; do
            name=$(node -p "require('./${package}package.json').name")
            version=$(node -p "require('./${package}package.json').version")
            # skip versions published by an earlier attempt, so that a failed run can be re-run
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              continue
            fi
            npm publish --access public --provenance "$package"
          done

  # server.json refers to the npm package, so it has to be published first
  publish-mcp-registry:
    runs-on: ubuntu-latest
    needs: [release-please, publish-npm]
    if: needs.release-please.outputs.release_created == 'true'
    environment:
      name: mcp-registry
      url: https://registry.modelcontextprotocol.io/v0/servers?search=io.github.headlesshq/headlessmc-mcp
    permissions:
      contents: read
      # the MCP Registry's GitHub OIDC login
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # the registry validates the npm package, a freshly published version can take a few minutes to show up on npm
      - name: Wait for the npm package
        run: |
          name=$(jq -r '.packages[0].identifier' server.json)
          version=$(jq -r '.packages[0].version' server.json)
          url="https://registry.npmjs.org/${name/\//%2f}/$version"
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null "$url"; then
              echo "$name@$version is available"
              exit 0
            fi
            echo "$name@$version is not available yet (attempt $attempt), waiting"
            sleep 20
          done
          echo "$name@$version did not show up on npm" >&2
          exit 1
      - name: Publish to the MCP Registry
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          # npm's CDN can still serve a stale answer to the registry, so retry a few times
          for attempt in $(seq 1 5); do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "publish failed (attempt $attempt), retrying"
            sleep 60
          done
          exit 1
